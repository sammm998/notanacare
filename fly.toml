# fly launch --copy-config --no-deploy && fly deploy
app = "notana-care-planner"
primary_region = "arn"   # Stockholm

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
